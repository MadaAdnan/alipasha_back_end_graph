extend type Query{
    cities:[City] @all
    mainCity:[City] @all @where(key: "is_main", operator: "=", value: 1)
    citiesByCategory(categoryId:Int):[City]
    citiesHasVendor(type:String):[City]
    countries:[Country] @all
}


type City{
    id:ID!
    name:String
    image:String @field(resolver: "App\\GraphQL\\Resolvers\\Image@getImage")
    city_id:Int
    city:City @belongsTo
    is_delivery:Boolean
    is_main:Boolean
    children:[City] @hasMany
    level:Int
    code_city:String
    latitude:Float
    longitude:Float
}

type Country{
    id:ID!
    name:String
    code:String
    image:String @field(resolver: "App\\GraphQL\\Resolvers\\Image@getImage")

}
