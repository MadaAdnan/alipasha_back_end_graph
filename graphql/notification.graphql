extend type Query{

    notifications(first:Int,page:Int):[Notification] @guard @paginate(builder:"App\\GraphQL\\Queries\\NotificationsQuery")
    forceNotification : NotificationData @guard

}


type Notification{
  data:NotificationData
    created_at:HumanDate

}

type NotificationData{
    title:String
    body:String
    url:String
}




